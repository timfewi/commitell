name: Bug report
description: Report a reproducible problem in commitell
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve commitell. Redact API keys, private diffs,
        repository URLs, email addresses, and other sensitive data.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `commitell --version`.
      placeholder: commitell 0.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, Git version, and installation method.
      placeholder: NixOS x86_64, Git 2.x, installed from Nix flake
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a minimal repository with synthetic content whenever possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized output or logs.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data
      options:
        - label: I removed API keys, secrets, and private repository content.
          required: true
